# Publishes the site to Navneet's own Cloudflare account every time main moves.
#
# The point of this file is that nobody has to press anything. Merge a change
# and it is live a couple of minutes later, whether the change came from Claude
# or from ChatGPT. The ChatGPT Sites publish is untouched and still works.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys at once would race each other onto the same database.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITES_BUILD_TIMEOUT: 15m
          # The site's own public address, baked in so the canonical link,
          # the sitemap and share previews point at wherever it is really
          # published. Unset simply keeps the previous ChatGPT address.
          VITE_SITE_URL: ${{ secrets.SITE_URL }}

      # Reported, never blocking. Two checks in the starter have always failed,
      # and a deploy should not be held hostage to them.
      - name: Check
        run: node --test tests/*.test.mjs || echo "Some checks did not pass. See above; the deploy continues."

      - name: Prepare the deploy
        run: node scripts/deploy-cloudflare.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}

      # A wrong id here fails with Cloudflare's "No route for that URI", which
      # names nothing and reads like an outage. Ask the account what it actually
      # has, so the log says which value is wrong and what to put there instead.
      - name: Check the Cloudflare connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if ! npx wrangler d1 list --json > /tmp/d1.json 2>/tmp/d1.err; then
            echo "Could not ask Cloudflare which databases this account has."
            echo "That usually means CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is wrong,"
            echo "or the token was made without D1 permission."
            cat /tmp/d1.err
            exit 1
          fi
          echo "Databases on this Cloudflare account:"
          node -e '
            const list = JSON.parse(require("fs").readFileSync("/tmp/d1.json", "utf8"));
            for (const db of list) console.log(`  name: ${db.name}   id: ${db.uuid}`);
            const byId = list.find(db => db.uuid === process.env.DATABASE_ID);
            const byName = list.find(db => db.name === process.env.DATABASE_NAME);
            if (byId && byId.name === process.env.DATABASE_NAME) process.exit(0);
            console.log("");
            if (!list.length) {
              console.log("This account has no D1 database yet. Create one, then put its name in");
              console.log("CLOUDFLARE_D1_DATABASE_NAME and its Database ID in CLOUDFLARE_D1_DATABASE_ID.");
            } else if (byName) {
              console.log(`The database named "${byName.name}" exists, but CLOUDFLARE_D1_DATABASE_ID does not match it.`);
              console.log(`Set CLOUDFLARE_D1_DATABASE_ID to: ${byName.uuid}`);
            } else if (byId) {
              console.log(`That id belongs to the database named "${byId.name}".`);
              console.log(`Set CLOUDFLARE_D1_DATABASE_NAME to: ${byId.name}`);
            } else {
              console.log("Neither the name nor the id matches anything on this account.");
              console.log("Copy both values from one of the databases listed above.");
            }
            process.exit(1);
          '

      # Tables first, then the code that expects them. The other order shows
      # readers an error page for as long as the migration takes.
      - name: Update the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
        run: npx wrangler d1 migrations apply "$DATABASE_NAME" --config .deploy.wrangler.json --remote

      - name: Publish
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Kept out of the worker's plain settings so the admin passcode is not
      # readable from the Cloudflare dashboard.
      #
      # The check for an empty passcode is inside the script on purpose: a step's
      # `if:` cannot read the secrets context, and using it there makes GitHub
      # reject the whole file before a single step runs.
      - name: Set the admin passcode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "No ADMIN_TOKEN secret is set. Leaving the worker's current passcode alone."
            exit 0
          fi
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config dist/server/wrangler.json
