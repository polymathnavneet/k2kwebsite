# Publishes the site to Navneet's own Cloudflare account every time main moves.
#
# The point of this file is that nobody has to press anything. Merge a change
# and it is live a couple of minutes later, whether the change came from Claude
# or from ChatGPT. The ChatGPT Sites publish is untouched and still works.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys at once would race each other onto the same database.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Before anything is built, because the site's own address comes out of
      # this and has to be baked into the build.
      - name: Work out where this is going
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: node scripts/resolve-cloudflare.mjs

      - name: Build
        env:
          SITES_BUILD_TIMEOUT: 15m
          # The site's own public address, baked in so the canonical link, the
          # sitemap and share previews point at wherever it is really published.
          # A SITE_URL secret wins, for when a real domain is set up later.
          VITE_SITE_URL: ${{ secrets.SITE_URL || env.CF_SITE_URL }}
        run: npm run build

      # Reported, never blocking. Two checks in the starter have always failed,
      # and a deploy should not be held hostage to them.
      - name: Check
        run: node --test tests/*.test.mjs || echo "Some checks did not pass. See above; the deploy continues."

      - name: Prepare the deploy
        run: node scripts/deploy-cloudflare.mjs

      # Tables first, then the code that expects them. The other order shows
      # readers an error page for as long as the migration takes.
      - name: Update the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "$CF_D1_NAME" --config .deploy.wrangler.json --remote

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      # Kept out of the worker's plain settings so the admin passcode is not
      # readable from the Cloudflare dashboard.
      #
      # The check for an empty passcode is inside the script on purpose: a step's
      # `if:` cannot read the secrets context, and using it there makes GitHub
      # reject the whole file before a single step runs.
      - name: Set the passcodes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TRACK_KEY: ${{ secrets.TRACK_KEY }}
        run: |
          put() {
            if [ -z "$2" ]; then
              echo "No $1 secret is set. Leaving the worker's current value alone."
              return 0
            fi
            printf '%s' "$2" | npx wrangler secret put "$1" --config dist/server/wrangler.json
          }
          put ADMIN_TOKEN "$ADMIN_TOKEN"
          # Lets a phone tracker app add positions and nothing else. Separate
          # from the admin passcode on purpose: it lives in a URL on a phone.
          put TRACK_KEY "$TRACK_KEY"

      # Put the address on the run's summary page, so finding it does not mean
      # reading a log.
      - name: Where it went
        run: |
          {
            echo "### The site is live"
            echo ""
            echo "- Website: $CF_SITE_URL"
            echo "- Admin panel: $CF_SITE_URL/admin"
          } >> "$GITHUB_STEP_SUMMARY"
