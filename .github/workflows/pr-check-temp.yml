name: PR build check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITES_BUILD_TIMEOUT: 12m
        run: npm run build
      - name: Tests
        run: node --test tests/*.test.mjs
