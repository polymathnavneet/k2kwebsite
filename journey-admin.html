<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>K2K Journey Publisher</title><link rel="stylesheet" href="styles.css"></head><body><main class="admin-wrap shell"><div class="eyebrow">PRIVATE JOURNEY PUBLISHER</div><h1 class="admin-title">Update the control room.</h1><p class="lede">Save the token on this phone once. Update only what changed; the public homepage refreshes within a minute.</p><form id="journeyForm" class="form admin-publisher"><label class="full">PRIVATE TOKEN<input id="token" type="password" autocomplete="current-password" required></label><label>MODE<select id="mode"><option value="preparation">Preparation</option><option value="live">Live expedition</option></select></label><label>STATUS<input id="status" placeholder="Walking / Resting / Lunch stop"></label><label>DAY<input id="day" type="number" min="0" max="365"></label><label>CURRENT PLACE<input id="currentPlace"></label><label>DISTANCE TODAY (KM)<input id="distanceToday" type="number" min="0" max="100" step=".1"></label><label>TOTAL DISTANCE (KM)<input id="distanceTotal" type="number" min="0" max="6000" step=".1"></label><label>STEPS TODAY<input id="stepsToday" type="number" min="0"></label><label>WALKING MINUTES<input id="walkingMinutes" type="number" min="0" max="1440"></label><label>TEMPERATURE °C<input id="temperature" type="number" step=".1"></label><label>ALTITUDE M<input id="altitude" type="number"></label><label>PHONE BATTERY %<input id="battery" type="number" min="0" max="100"></label><label>CONNECTION<input id="connectivity" placeholder="4G / weak / offline"></label><label>LAST SLEPT<input id="lastSleep"></label><label>NEXT MAJOR STOP<input id="nextPlace"></label><label>ESTIMATED ARRIVAL<input id="nextPlaceEta"></label><label>PARTNER OF THE DAY<input id="sponsorName"></label><label class="full">LATEST STORY TITLE<input id="latestTitle"></label><label class="full">LATEST STORY SUMMARY<textarea id="latestText"></textarea></label><label class="full">LATEST STORY URL<input id="latestUrl" placeholder="journal.html or a video URL"></label><div class="full actions"><button class="button" type="submit">Publish update</button><button class="button secondary" id="loadCurrent" type="button">Load current data</button></div></form><div id="publisherStatus" class="admin-status" role="status">Nothing published yet.</div></main><script src="journey-data.js"></script><script src="journey-admin.js"></script></body></html>
